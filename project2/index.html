<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Title</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
 
    .hero {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;           /* the black bars */
      container-type: size;       /* lets the frame measure the real visible area */
    }
 
    /* Frame = Title.png's exact shape (2388 x 1668), as big as fits the window */
    .hero .frame {
      width: min(100vw, calc(100vh * 2388 / 1668));
      width: min(100cqw, calc(100cqh * 2388 / 1668));
      aspect-ratio: 2388 / 1668;
      position: relative;
      overflow: hidden;           /* clips the tilt so nothing outside the image shows */
      perspective: 200vmax;
    }
 
    .hero .frame .hero-img {
      display: block;
      width: 100%;
      height: 100%;
      /* --zoom is 1 when flat (whole image visible) and grows only as much as the tilt needs */
      transform: scale(var(--zoom, 1)) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
      transition: transform 0.4s ease-out;
      user-select: none;
      -webkit-user-drag: none;
    }
 
    /* Start button: placed on the poster where the reference shows it
       (all values are % of the poster, so it stays put at any window size) */
    .hero .frame .start {
      position: absolute;
      left: 50.6%;                /* horizontal centre of the button */
      top: 88.6%;                 /* vertical centre of the button */
      height: 12.9%;              /* button size relative to the poster height */
      transform: translate(-50%, -50%);
      z-index: 5;                 /* always above the poster */
      line-height: 0;
    }
 
    .hero .frame .start img {
      display: block;
      height: 100%;
      width: auto;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.25s ease-out;
    }
 
    .hero .frame .start img:hover {
      transform: scale(1.1);      /* expands slightly on hover */
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="frame">
      <img class="hero-img" src="Title.png" alt="Title">
      <div class="start">
        <img src="start.png" alt="Start">
      </div>
    </div>
  </div>
 
  <script>
    const hero = document.querySelector('.hero');
    const MAX_TILT = 3; // degrees
 
    function setTilt(tx, ty) {
      // zoom only as much as the current tilt needs, so the flat view shows the full image
      const zoom = 1.005 + 0.007 * (Math.abs(tx) + Math.abs(ty));
      hero.style.setProperty('--tilt-x', tx + 'deg');
      hero.style.setProperty('--tilt-y', ty + 'deg');
      hero.style.setProperty('--zoom', tx === 0 && ty === 0 ? 1 : zoom);
    }
 
    addEventListener('pointermove', (e) => {
      setTilt(-((e.clientY / innerHeight) * 2 - 1) * MAX_TILT,
               ((e.clientX / innerWidth) * 2 - 1) * MAX_TILT);
    });
 
    document.addEventListener('mouseleave', () => setTilt(0, 0));
  </script>
</body>
</html>
